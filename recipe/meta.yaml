{% set python_min = "3.10" %}
{% set name = "pydantic-settings-sops" %}
{% set version = "0.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pydantic_settings_sops-{{ version }}.tar.gz
  sha256: 8d03ea8233cec696b4737563947bc668a7cd4a2773252b40948f850784d718cd

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-scm
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - pydantic-settings >=2.5.2,<3
    - sopsy >=1.0.1,<2

test:
  imports:
    - pydantic_settings_sops
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pavelzw/pydantic-settings-sops
  summary: SOPS extension for pydantic-settings
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
